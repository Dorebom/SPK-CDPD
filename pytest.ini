[pytest]
testpaths = tests packages/chatgpt-web-api/tests
pythonpath = packages/cdpd/src packages/chatgpt-web-api/src packages/cdpd-chatgpt-adapter/src
markers =
    browser: isolated local Chromium integration (requires CDPD_TEST_BROWSER=1)
    no_windows_synthetic_capability: test explicitly exercises default Windows DENY without the scoped synthetic fixture
